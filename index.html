<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174b3b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('noor-textiles-erp-ui-v1') || 'null');
        const theme = saved?.version === 1 ? saved.preferences?.theme : 'system';
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch { document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches); }
    </script>
    <meta name="description" content="نور ٹیکسٹائلز لاہور — خریداری، کپڑے اور پیداوار کا مقامی ڈیمو" />
    <title>نور ٹیکسٹائلز لاہور | ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
